name: documind_ai
description: "DocuMind AI - Government Document Intelligence & Verification Platform (SIH PS23)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Camera & document scanning
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.3.0

  # Media / documents
  pdf: ^3.11.1
  printing: ^5.13.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # UI
  fl_chart: ^0.70.0
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_svg: ^2.0.16
  intl: ^0.20.1
  google_fonts: ^6.2.1

  # Utilities
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  uuid: ^4.5.1
  logger: ^2.5.0
  equatable: ^2.0.7
  file_picker: ^8.1.6
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
