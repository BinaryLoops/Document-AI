# Prometheus scrape configuration for the DocuMind AI Backend.
# Mounted into the `prometheus` service by docker-compose.yml (--profile monitoring).
#
# Metrics are exposed by prometheus-fastapi-instrumentator at /metrics
# (see main.py -> create_app()). Default request/latency/status-code
# histograms are collected automatically for every route.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "documind-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "documind-backend"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
